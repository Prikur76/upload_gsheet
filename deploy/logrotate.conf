# /etc/logrotate.d/upload-gsheet
# Ротация логов upload-gsheet.
# Установить: sudo cp deploy/logrotate.conf /etc/logrotate.d/upload-gsheet
# Проверить:  sudo logrotate -d /etc/logrotate.d/upload-gsheet

/opt/upload_gsheet/logs/*.log {
    daily
    rotate 7
    missingok
    notifempty
    compress
    delaycompress
    copytruncate
    maxsize 10M
}
